AWSTemplateFormatVersion: '2010-09-09'
Description: >
  DevOps Agent Operations Dashboard — Dashboard Stack (V2)
  Deploy ONCE in the centralized dashboard/analytics account.
  Creates S3 data lake, Glue crawler, Athena workgroup, and QuickSight IAM policy.
  QuickSight datasets and analysis are created by scripts/setup-dashboard.sh (Step 3).

Parameters:
  WorkloadAccountIds:
    Type: CommaDelimitedList
    Description: "Comma-separated AWS Account IDs that will send investigation data"

  QuickSightServiceRoleName:
    Type: String
    Default: "aws-quicksight-service-role-v0"
    Description: "Name of the QuickSight service role (check IAM if unsure)"

  GlueDatabaseName:
    Type: String
    Default: "devops_agent_dashboard"
    Description: "Name for the Glue/Athena database"

  DataRetentionDays:
    Type: Number
    Default: 1095
    MinValue: 1
    Description: >
      How long to keep investigation records in the centralized bucket, in days.
      This is the data the dashboard queries, so it caps how far back trend and
      month-over-month analysis can reach. Default is 3 years. Note that
      lifecycle deletions are NOT replicated, so this setting is independent of
      the workload accounts' staging retention.

  AthenaResultsRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    Description: "How long to keep Athena query results. These are disposable."

Resources:

  # ============================================
  # S3 Data Lake Bucket
  # ============================================
  DashboardBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub "devops-agent-dashboard-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      # Cross-account replication writes here, but nothing should be public.
      # The bucket policy grants access by aws:PrincipalAccount only.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false   # a bucket policy IS required for replication
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldData
            Status: Enabled
            ExpirationInDays: !Ref DataRetentionDays
      Tags:
        - Key: Project
          Value: devops-agent-dashboard

  DashboardBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DashboardBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowReplicationFromWorkloadAccounts
            Effect: Allow
            Principal: "*"
            Action:
              - s3:ReplicateObject
              - s3:ReplicateDelete
              - s3:ReplicateTags
              - s3:ObjectOwnerOverrideToBucketOwner
            Resource: !Sub "${DashboardBucket.Arn}/*"
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref WorkloadAccountIds
          - Sid: AllowReplicationCheck
            Effect: Allow
            Principal: "*"
            Action:
              - s3:List*
              - s3:GetBucketVersioning
              - s3:PutBucketVersioning
            Resource: !GetAtt DashboardBucket.Arn
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref WorkloadAccountIds

  # ============================================
  # Athena Results Bucket
  # ============================================
  AthenaResultsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub "devops-agent-athena-results-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireResults
            Status: Enabled
            ExpirationInDays: !Ref AthenaResultsRetentionDays
      Tags:
        - Key: Project
          Value: devops-agent-dashboard

  # ============================================
  # Athena WorkGroup
  # ============================================
  # Without this, queries run in the account's default `primary` workgroup and
  # results land in Athena's own auto-created bucket -- leaving AthenaResultsBucket
  # created but never written to. Worse, in an account where Athena has never been
  # used, `primary` has no OutputLocation at all and every query fails, so the
  # dashboard would break on first install.
  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "devops-agent-${AWS::AccountId}"
      Description: "Query workgroup for the DevOps Agent operations dashboard"
      State: ENABLED
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        # EnforceWorkGroupConfiguration keeps results in this bucket even if a
        # client supplies its own OutputLocation.
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        ResultConfiguration:
          OutputLocation: !Sub "s3://${AthenaResultsBucket}/query-results/"
          EncryptionConfiguration:
            EncryptionOption: SSE_S3
      Tags:
        - Key: Project
          Value: devops-agent-dashboard

  # ============================================
  # Glue Database + Crawler
  # ============================================
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref GlueDatabaseName
        Description: "DevOps Agent investigation analytics"

  GlueCrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "devops-agent-glue-crawler-role-${AWS::AccountId}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DashboardBucket.Arn
                  - !Sub "${DashboardBucket.Arn}/*"

  InvestigationsCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub "devops-agent-crawler-${AWS::AccountId}"
      Role: !GetAtt GlueCrawlerRole.Arn
      DatabaseName: !Ref GlueDatabase
      Targets:
        S3Targets:
          - Path: !Sub "s3://${DashboardBucket}/investigations-v2/"
          - Path: !Sub "s3://${DashboardBucket}/recommendations-v1/"
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG
      Schedule:
        ScheduleExpression: "cron(0/30 * * * ? *)"

  # ============================================
  # QuickSight Service Role Permissions
  # ============================================
  QuickSightServicePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "DevOpsAgentDashboardAccess-${AWS::AccountId}"
      Roles:
        - !Ref QuickSightServiceRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3Access
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !GetAtt DashboardBucket.Arn
              - !Sub "${DashboardBucket.Arn}/*"
              - !GetAtt AthenaResultsBucket.Arn
              - !Sub "${AthenaResultsBucket.Arn}/*"
          - Sid: AthenaResultsWrite
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:AbortMultipartUpload
            Resource:
              - !Sub "${AthenaResultsBucket.Arn}/*"
          - Sid: AthenaAccess
            Effect: Allow
            Action:
              - athena:StartQueryExecution
              - athena:GetQueryExecution
              - athena:GetQueryResults
              - athena:StopQueryExecution
              - athena:GetWorkGroup
            Resource: !Sub "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AthenaWorkGroup}"
          - Sid: GlueAccess
            Effect: Allow
            Action:
              - glue:GetTable
              - glue:GetTables
              - glue:GetDatabase
              - glue:GetDatabases
              - glue:GetPartitions
              - glue:GetPartition
              - glue:BatchGetPartition
            Resource: "*"

Outputs:
  DashboardBucketName:
    Value: !Ref DashboardBucket
    Description: "Pass this as DashboardBucketName parameter to collection-stack.yaml"
    Export:
      Name: DevOpsAgentDashboardBucket

  DashboardAccountId:
    Value: !Ref AWS::AccountId
    Description: "Pass this as DashboardAccountId parameter to collection-stack.yaml"

  AthenaResultsBucket:
    Value: !Ref AthenaResultsBucket

  AthenaWorkGroupName:
    Value: !Ref AthenaWorkGroup
    Description: "Athena workgroup used by the QuickSight data source"

  GlueDatabaseName:
    Value: !Ref GlueDatabase

  CrawlerName:
    Value: !Ref InvestigationsCrawler

  QuickSightDashboard:
    Value: !Sub "https://${AWS::Region}.quicksight.aws.amazon.com/sn/analyses/devops-agent-operations-dashboard"
    Description: "Analysis URL, valid after scripts/setup-dashboard.sh has run (Step 3)"
