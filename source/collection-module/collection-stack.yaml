AWSTemplateFormatVersion: '2010-09-09'
Description: >
  DevOps Agent Operations Dashboard — Collection Pipeline (V2)
  Deploy this stack in EACH workload account that has DevOps Agent agentspaces.
  Captures investigation completions via EventBridge, parses them into flat JSON, 
  and replicates to the centralized dashboard account.

Parameters:
  DashboardAccountId:
    Type: String
    Description: "AWS Account ID of the centralized dashboard account"

  DashboardBucketName:
    Type: String
    Description: "Name of the S3 bucket in the dashboard account (receives replicated data)"

  LogRetentionDays:
    Type: Number
    Default: 30
    Description: "CloudWatch Logs retention for the collector Lambda, in days"
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]

  DataRetentionDays:
    Type: Number
    Default: 365
    MinValue: 1
    Description: >
      How long to keep collected investigation records in this account's staging
      bucket. This bucket is only a staging area -- records are replicated to the
      dashboard account, which holds its own (independent) retention setting.

Resources:

  # ============================================
  # S3 Collection Bucket (local, replicates to dashboard)
  # ============================================
  CollectionBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      # Region is included because S3 bucket names are GLOBAL. Without it, a
      # customer running DevOps Agent in two regions in the same account
      # cannot deploy this stack twice -- the second attempt fails on
      # bucket-already-exists.
      BucketName: !Sub "devops-agent-collection-${AWS::AccountId}-${AWS::Region}"
      # Versioning is required for S3 replication.
      VersioningConfiguration:
        Status: Enabled
      # Explicit rather than relying on the account default, so the template
      # is self-documenting and cannot be weakened by account-level settings.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      # This bucket only ever holds investigation metadata written by the
      # collector and read by replication. Nothing should be public.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldData
            Status: Enabled
            ExpirationInDays: !Ref DataRetentionDays
      ReplicationConfiguration:
        Role: !GetAtt ReplicationRole.Arn
        Rules:
          - Id: ReplicateInvestigations
            Status: Enabled
            # Using Filter puts this rule on S3's V2 replication schema, which
            # requires Priority and DeleteMarkerReplication to be explicit.
            # Omitting them fails with "Priority must be specified for this
            # version of Cross Region Replication configuration schema".
            Priority: 1
            Filter:
              Prefix: "investigations-v2/"
            DeleteMarkerReplication:
              # Enabled so that removing a record at the source also removes it
              # from the dashboard account, keeping the two in agreement.
              Status: Enabled
            Destination:
              Bucket: !Sub "arn:aws:s3:::${DashboardBucketName}"
              Account: !Ref DashboardAccountId
              AccessControlTranslation:
                Owner: Destination
          - Id: ReplicateRecommendations
            Status: Enabled
            Priority: 2
            Filter:
              Prefix: "recommendations-v1/"
            DeleteMarkerReplication:
              Status: Enabled
            Destination:
              Bucket: !Sub "arn:aws:s3:::${DashboardBucketName}"
              Account: !Ref DashboardAccountId
              AccessControlTranslation:
                Owner: Destination
      Tags:
        - Key: Project
          Value: devops-agent-dashboard

  # ============================================
  # S3 Replication Role
  # ============================================
  ReplicationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "devops-agent-s3-replication-${AWS::AccountId}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReplicationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # These reference the bucket by constructed name, NOT by
              # !GetAtt CollectionBucket.Arn. The bucket's own
              # ReplicationConfiguration references this role, so a reference
              # back to the bucket here would create a circular dependency
              # that CloudFormation rejects. The name must therefore be kept
              # in sync with the BucketName property above.
              - Effect: Allow
                Action:
                  - s3:GetReplicationConfiguration
                  - s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::devops-agent-collection-${AWS::AccountId}-${AWS::Region}"
              - Effect: Allow
                Action:
                  - s3:GetObjectVersionForReplication
                  - s3:GetObjectVersionAcl
                  - s3:GetObjectVersionTagging
                Resource: !Sub "arn:${AWS::Partition}:s3:::devops-agent-collection-${AWS::AccountId}-${AWS::Region}/*"
              - Effect: Allow
                Action:
                  - s3:ReplicateObject
                  - s3:ReplicateDelete
                  - s3:ReplicateTags
                  - s3:ObjectOwnerOverrideToBucketOwner
                Resource: !Sub "arn:aws:s3:::${DashboardBucketName}/*"

  # ============================================
  # Lambda Collector (V2 — flat JSON output)
  # ============================================
  CollectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "devops-agent-collector-role-${AWS::AccountId}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CollectorAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${CollectionBucket.Arn}/*"
              # ListAgentSpaces has no resource type in the service
              # authorization reference, so it must be scoped to "*".
              - Sid: DevOpsAgentDiscovery
                Effect: Allow
                Action:
                  - aidevops:ListAgentSpaces
                Resource: "*"
              # All remaining reads are scoped to agentspace resources in
              # this account/region. Read/List only -- no write actions.
              - Sid: DevOpsAgentRead
                Effect: Allow
                Action:
                  - aidevops:GetAgentSpace
                  - aidevops:ListJournalRecords
                  - aidevops:ListExecutions
                  - aidevops:ListBacklogTasks
                  - aidevops:ListGoals
                  - aidevops:ListRecommendations
                Resource: !Sub "arn:${AWS::Partition}:aidevops:${AWS::Region}:${AWS::AccountId}:agentspace/*"
              - Effect: Allow
                Action:
                  - tag:GetResources
                Resource: "*"

  CollectorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: devops-agent-investigation-collector
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt CollectorRole.Arn
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          COLLECTION_BUCKET: !Ref CollectionBucket
          ACCOUNT_ID: !Ref AWS::AccountId
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          from datetime import datetime, timezone

          s3 = boto3.client('s3')
          devops_agent = boto3.client('devops-agent')
          BUCKET = os.environ['COLLECTION_BUCKET']
          ACCOUNT_ID = os.environ['ACCOUNT_ID']
          REGION = os.environ.get('AWS_REGION', 'us-east-1')

          def handler(event, context):
              detail = event.get('detail', {})
              metadata = detail.get('metadata', {})
              data = detail.get('data', {})
              agent_space_id = metadata.get('agent_space_id', 'unknown')
              execution_id = metadata.get('execution_id', 'unknown')
              status = data.get('status') or detail.get('status') or 'COMPLETED'
              priority = data.get('priority') or detail.get('priority') or 'MEDIUM'
              # NOTE: event['time'] is deliberately NOT used. Timing comes from
              # journal records so live and backfill agree exactly.

              # Get workload name from agentspace tags
              try:
                  agentspace_info = devops_agent.get_agent_space(agentSpaceId=agent_space_id)
                  tags = agentspace_info.get('tags', {})
              except Exception as e:
                  print(f"Warning: Could not get agent space info: {e}")
                  tags = {}
              workload_name = tags.get('workload', 'unknown')

              # Fetch journal records
              records = []
              next_token = None
              try:
                  while True:
                      params = {'agentSpaceId': agent_space_id, 'executionId': execution_id, 'limit': 100}
                      if next_token:
                          params['nextToken'] = next_token
                      response = devops_agent.list_journal_records(**params)
                      records.extend(response.get('records', []))
                      next_token = response.get('nextToken')
                      if not next_token:
                          break
              except Exception as e:
                  print(f"Error fetching records: {e}")
                  return {'statusCode': 500, 'error': str(e)}

              # Parse investigation_summary and utilization from journal records
              summary = None
              summary_created_at = None
              utilization = None
              record_timestamps = []
              for record in records:
                  rt = record.get('recordType', '')
                  created = record.get('createdAt')
                  if created:
                      record_timestamps.append(created)
                  if rt == 'investigation_summary':
                      try:
                          content = record.get('content', {})
                          if isinstance(content, str):
                              summary = json.loads(content)
                          elif isinstance(content, dict):
                              summary = content
                          if summary is not None:
                              summary_created_at = created
                      except Exception:
                          pass
                  elif rt == 'utilization':
                      try:
                          content = record.get('content', {})
                          if isinstance(content, str):
                              parsed = json.loads(content)
                          elif isinstance(content, dict):
                              parsed = content
                          else:
                              parsed = None
                          # Keep the utilization record with highest context window (most complete)
                          if parsed:
                              new_util = parsed.get('data', {}).get('context_window', {}).get('utilization', 0.0)
                              old_util = utilization.get('data', {}).get('context_window', {}).get('utilization', 0.0) if utilization else 0.0
                              if new_util >= old_util:
                                  utilization = parsed
                      except Exception:
                          pass

              if not summary:
                  print(f"No investigation_summary found for {execution_id}")
                  return {'statusCode': 200, 'message': 'No summary record found'}

              # Time to RCA: both endpoints from immutable journal records.
              # start = earliest record, end = investigation_summary record.
              # event.time and task.updatedAt are NOT used -- the former makes
              # live and backfill disagree, the latter drifts on later activity.
              investigation_started_at = min(record_timestamps) if record_timestamps else None
              investigation_completed_at = summary_created_at
              duration_minutes = 0.0
              if investigation_started_at and investigation_completed_at:
                  try:
                      duration_minutes = round((investigation_completed_at - investigation_started_at).total_seconds() / 60.0, 1)
                  except Exception as e:
                      print(f"Warning: Could not calculate duration: {e}")
              if duration_minutes < 0:
                  print(f"Warning: negative duration for {execution_id}; clamping to 0")
                  duration_minutes = 0.0

              completed_iso = investigation_completed_at.astimezone(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
              started_iso = investigation_started_at.astimezone(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ') if investigation_started_at else ''
              investigation_date = completed_iso[:10]
              investigation_month = completed_iso[:7]

              # Extract symptoms
              symptoms = [s.get('title', '') for s in summary.get('symptoms', []) if s.get('title')]

              # Extract findings
              root_cause = ''
              root_cause_description = ''
              related_resources = []
              causes = []
              for f in summary.get('findings', []):
                  if f.get('type') == 'root_cause':
                      root_cause = f.get('title', '')
                      root_cause_description = f.get('description', '')
                      related_resources = f.get('related_resources', [])
                  else:
                      title = f.get('title', '')
                      if title:
                          causes.append(title)

              if not root_cause and causes:
                  root_cause = causes.pop(0)
                  for f in summary.get('findings', []):
                      if f.get('title') == root_cause:
                          root_cause_description = f.get('description', '')
                          related_resources = f.get('related_resources', [])
                          break

              if not related_resources:
                  for f in summary.get('findings', []):
                      related_resources.extend(f.get('related_resources', []))
                  for s in summary.get('symptoms', []):
                      related_resources.extend(s.get('related_resources', []))
                  related_resources = sorted(list(set(related_resources)))

              # Extract gaps
              gaps = [g.get('title', '') for g in summary.get('investigation_gaps', []) if g.get('title')]

              resolved = any(f.get('type') == 'root_cause' for f in summary.get('findings', []))

              context_window_utilization = 0.0
              compaction_count = 0
              subagents_used = []
              total_tool_calls = 0
              if utilization:
                  u_data = utilization.get('data', {})
                  context_window_utilization = u_data.get('context_window', {}).get('utilization', 0.0)
                  compaction_count = u_data.get('context_window', {}).get('compaction_count', 0)
                  subagents_used = [sa.get('id', '') for sa in u_data.get('subagents', [])]
                  total_tool_calls = sum(t.get('tool_use_count', 0) for t in u_data.get('tools', []))

              console_url = f"https://{REGION}.console.aws.amazon.com/devops-agent/home?region={REGION}#/agentspaces/{agent_space_id}/executions/{execution_id}"

              # Build flat output
              output = {
                  'executionId': execution_id, 'agentSpaceId': agent_space_id,
                  'workloadName': workload_name, 'accountId': ACCOUNT_ID,
                  'status': status, 'priority': priority,
                  'investigationStartedAt': started_iso,
                  'investigationCompletedAt': completed_iso,
                  'durationMinutes': duration_minutes,
                  'investigationDate': investigation_date, 'investigationMonth': investigation_month,
                  'resolved': resolved, 'consoleUrl': console_url,
                  'symptoms': symptoms, 'rootCause': root_cause,
                  'rootCauseDescription': root_cause_description,
                  'causes': causes, 'gaps': gaps, 'relatedResources': related_resources,
                  'symptomCount': len(symptoms), 'causeCount': len(causes),
                  'gapCount': len(gaps), 'resourceCount': len(related_resources),
                  'contextWindowUtilization': context_window_utilization,
                  'compactionCount': compaction_count,
                  'subagentsUsed': subagents_used,
                  'totalToolCalls': total_tool_calls,
                  'subagentCount': len(subagents_used),
                  'agentCostUsd': round(duration_minutes * 60 * 0.0083, 2) if duration_minutes > 0 else 0.0
              }

              # Write to S3. The key is a pure function of three immutable
              # values (accountId / agentSpaceId / executionId), so the same
              # investigation can only ever produce one object. The date is
              # deliberately NOT in the path -- it used to be, and a backfill
              # that derived it differently created duplicate rows under two
              # day= partitions. Date filtering uses the investigationDate and
              # investigationMonth columns inside the record instead.
              key = f"investigations-v2/account_id={ACCOUNT_ID}/agentspace_id={agent_space_id}/{execution_id}.json"
              s3.put_object(Bucket=BUCKET, Key=key, Body=json.dumps(output, default=str), ContentType='application/json')

              print(f"Collected: {execution_id} | workload={workload_name} | duration={duration_minutes}min | resolved={resolved}")
              return {'statusCode': 200, 'executionId': execution_id, 'workloadName': workload_name, 'durationMinutes': duration_minutes, 'resolved': resolved}

  # ============================================
  # Lambda Log Group
  #
  # Declared explicitly so retention is bounded. If Lambda auto-creates the
  # group on first invocation it defaults to "Never expire", and the logs
  # accumulate indefinitely as a slow, invisible cost.
  # ============================================
  CollectorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CollectorFunction}"
      RetentionInDays: !Ref LogRetentionDays

  # ============================================
  # EventBridge Rule
  # ============================================
  InvestigationCompletedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: devops-agent-investigation-completed
      Description: "Captures DevOps Agent investigation completion events"
      EventPattern:
        source:
          - aws.aidevops
        detail-type:
          - "Investigation Completed"
          - "Investigation Failed"
          - "Investigation Timed Out"
      State: ENABLED
      Targets:
        - Id: CollectorLambda
          Arn: !GetAtt CollectorFunction.Arn

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CollectorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt InvestigationCompletedRule.Arn

  # ============================================
  # Recommendation Collector (weekly schedule)
  # ============================================
  RecommendationCollectorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: "/aws/lambda/devops-agent-recommendation-collector"
      RetentionInDays: !Ref LogRetentionDays

  RecommendationCollectorFunction:
    Type: AWS::Lambda::Function
    DependsOn: RecommendationCollectorLogGroup
    Properties:
      FunctionName: devops-agent-recommendation-collector
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt CollectorRole.Arn
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          COLLECTION_BUCKET: !Ref CollectionBucket
          ACCOUNT_ID: !Ref AWS::AccountId
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          from datetime import datetime, timezone

          s3 = boto3.client('s3')
          devops_agent = boto3.client('devops-agent')
          BUCKET = os.environ['COLLECTION_BUCKET']
          ACCOUNT_ID = os.environ['ACCOUNT_ID']

          def handler(event, context):
              collected = 0
              errors = 0

              # 1. List all AgentSpaces
              agent_spaces = []
              next_token = None
              while True:
                  params = {}
                  if next_token:
                      params['nextToken'] = next_token
                  resp = devops_agent.list_agent_spaces(**params)
                  agent_spaces.extend(resp.get('agentSpaces', []))
                  next_token = resp.get('nextToken')
                  if not next_token:
                      break

              print(f"Found {len(agent_spaces)} AgentSpaces")
              collected_at = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

              for space in agent_spaces:
                  agent_space_id = space['agentSpaceId']

                  # 2. Get workload tag
                  try:
                      info = devops_agent.get_agent_space(agentSpaceId=agent_space_id)
                      workload_name = info.get('tags', {}).get('workload', 'unknown')
                  except Exception as e:
                      print(f"  WARNING: Could not get AgentSpace {agent_space_id}: {e}")
                      workload_name = 'unknown'

                  # 3. Get goals to find lastSuccessfulTaskId
                  try:
                      goals_response = devops_agent.list_goals(agentSpaceId=agent_space_id)
                      goals = goals_response.get('goals', [])
                  except Exception as e:
                      print(f"  WARNING: Could not list goals for {agent_space_id}: {e}")
                      goals = []

                  # 4. For each goal, get current recommendations
                  space_recommendations = []
                  for goal in goals:
                      task_id = goal.get('lastSuccessfulTaskId')
                      if not task_id:
                          continue

                      # list-recommendations is NOT auto-paginated -- handle nextToken
                      nt = None
                      while True:
                          params = {
                              'agentSpaceId': agent_space_id,
                              'taskId': task_id,
                              'limit': 100
                          }
                          if nt:
                              params['nextToken'] = nt
                          try:
                              r = devops_agent.list_recommendations(**params)
                          except Exception as e:
                              print(f"  ERROR: {agent_space_id}/{task_id}: {e}")
                              errors += 1
                              break

                          for rec in r.get('recommendations', []):
                              space_recommendations.append({
                                  'workloadName': workload_name,
                                  'collected_at': collected_at,
                                  'recommendationId': rec['recommendationId'],
                                  'title': rec['title'],
                                  'status': rec['status'],
                                  'priority': rec['priority'],
                                  'taskId': rec['taskId']
                              })

                          nt = r.get('nextToken')
                          if not nt:
                              break

                  # 5. Write to S3
                  key = f"recommendations-v1/account_id={ACCOUNT_ID}/agentspace_id={agent_space_id}/current.json"
                  if space_recommendations:
                      body = '\n'.join(json.dumps(r) for r in space_recommendations)
                      collected += len(space_recommendations)
                      print(f"  {agent_space_id} ({workload_name}): {len(space_recommendations)} recommendations")
                  else:
                      placeholder = {
                          'workloadName': workload_name,
                          'collected_at': collected_at,
                          'recommendationId': 'none',
                          'title': 'No recommendations exist',
                          'status': 'N/A',
                          'priority': 'N/A',
                          'taskId': 'none'
                      }
                      body = json.dumps(placeholder)
                      print(f"  {agent_space_id} ({workload_name}): 0 recommendations (placeholder)")

                  s3.put_object(Bucket=BUCKET, Key=key, Body=body.encode('utf-8'))

              print(f"\nDone. Collected: {collected}, Errors: {errors}")
              return {'statusCode': 200, 'collected': collected, 'errors': errors}

  RecommendationScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: devops-agent-recommendation-schedule
      Description: "Collect current DevOps Agent recommendations weekly"
      ScheduleExpression: "rate(7 days)"
      State: ENABLED
      Targets:
        - Id: RecommendationCollector
          Arn: !GetAtt RecommendationCollectorFunction.Arn

  RecommendationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RecommendationCollectorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RecommendationScheduleRule.Arn

Outputs:
  CollectionBucketName:
    Value: !Ref CollectionBucket
  CollectorFunctionArn:
    Value: !GetAtt CollectorFunction.Arn
  RecommendationCollectorFunctionArn:
    Value: !GetAtt RecommendationCollectorFunction.Arn
  EventBridgeRuleArn:
    Value: !GetAtt InvestigationCompletedRule.Arn
