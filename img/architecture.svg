<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1000" viewBox="0 0 1160 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#232F3E"/>
    </marker>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#687078"/>
    </marker>
  </defs>

  <rect width="1160" height="1000" fill="#FFFFFF"/>

  <text x="580" y="42" font-size="24" font-weight="bold" fill="#161E2D" text-anchor="middle">DevOps Agent Centralized Operations Dashboard</text>
  <text x="580" y="66" font-size="14" fill="#5A6B7B" text-anchor="middle">Multi-account collection of DevOps Agent investigation data into a single dashboard</text>

  <!-- ============ WORKLOAD ACCOUNT ============ -->
  <rect x="40" y="96" width="1080" height="330" rx="10" fill="#F7F9FA" stroke="#E8710A" stroke-width="2.5" stroke-dasharray="9,5"/>
  <rect x="40" y="96" width="290" height="30" rx="10" fill="#E8710A"/>
  <text x="58" y="117" font-size="14" font-weight="bold" fill="#FFFFFF">Workload Account(s) &#8212; 1..N</text>
  <text x="1104" y="117" font-size="12" fill="#E8710A" text-anchor="end">deployed second</text>

  <!-- DevOps Agent -->
  <rect x="76" y="176" width="196" height="86" rx="8" fill="#FFFFFF" stroke="#7D2FBF" stroke-width="2"/>
  <text x="174" y="205" font-size="14" font-weight="bold" fill="#161E2D" text-anchor="middle">AWS DevOps Agent</text>
  <text x="174" y="226" font-size="12" fill="#5A6B7B" text-anchor="middle">AgentSpace</text>
  <text x="174" y="246" font-size="11" fill="#7D2FBF" text-anchor="middle">runs investigation</text>

  <!-- EventBridge -->
  <rect x="332" y="176" width="196" height="86" rx="8" fill="#FFFFFF" stroke="#E7157B" stroke-width="2"/>
  <text x="430" y="205" font-size="14" font-weight="bold" fill="#161E2D" text-anchor="middle">EventBridge Rule</text>
  <text x="430" y="228" font-size="11" fill="#5A6B7B" text-anchor="middle">detail-type:</text>
  <text x="430" y="245" font-size="11" font-weight="bold" fill="#E7157B" text-anchor="middle">Investigation Completed</text>

  <!-- Lambda -->
  <rect x="588" y="176" width="210" height="86" rx="8" fill="#FFFFFF" stroke="#ED7100" stroke-width="2"/>
  <text x="693" y="202" font-size="14" font-weight="bold" fill="#161E2D" text-anchor="middle">Lambda</text>
  <text x="693" y="222" font-size="12" fill="#5A6B7B" text-anchor="middle">Investigation Collector</text>
  <text x="693" y="245" font-size="11" fill="#ED7100" text-anchor="middle">derives Time to RCA</text>

  <!-- S3 collection -->
  <rect x="858" y="164" width="222" height="110" rx="8" fill="#FFFFFF" stroke="#7AA116" stroke-width="2"/>
  <text x="969" y="190" font-size="14" font-weight="bold" fill="#161E2D" text-anchor="middle">S3 Collection Bucket</text>
  <text x="969" y="211" font-size="11" fill="#5A6B7B" text-anchor="middle">versioned &#183; SSE-S3</text>
  <text x="969" y="230" font-size="10" fill="#5A6B7B" text-anchor="middle">devops-agent-collection-</text>
  <text x="969" y="245" font-size="10" fill="#5A6B7B" text-anchor="middle">&#60;account&#62;-&#60;region&#62;</text>
  <text x="969" y="264" font-size="10" fill="#7AA116" text-anchor="middle">staging &#183; 365-day expiry</text>

  <!-- arrows across the row -->
  <line x1="272" y1="219" x2="326" y2="219" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="528" y1="219" x2="582" y2="219" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="798" y1="219" x2="852" y2="219" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- callback loop: Lambda -> DevOps Agent API -->
  <path d="M 640 262 L 640 330 L 174 330 L 174 262" fill="none" stroke="#687078" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowLight)"/>
  <text x="407" y="351" font-size="11.5" fill="#687078" text-anchor="middle">ListJournalRecords &#183; ListExecutions &#183; ListBacklogTasks &#8212; read-only</text>
  <text x="407" y="369" font-size="11" fill="#687078" text-anchor="middle">RCA time is derived from immutable journal records, never from event.time</text>

  <text x="969" y="300" font-size="10.5" fill="#5A6B7B" text-anchor="middle">key: investigations-v2/account_id=&#8230;/agentspace_id=&#8230;/</text>
  <text x="969" y="315" font-size="10.5" font-weight="bold" fill="#5A6B7B" text-anchor="middle">&#60;executionId&#62;.json</text>
  <text x="969" y="333" font-size="10" fill="#7AA116" text-anchor="middle">no date in path &#8594; idempotent</text>

  <!-- ============ REPLICATION ============ -->
  <line x1="969" y1="426" x2="969" y2="496" stroke="#7AA116" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="612" y="440" width="330" height="42" rx="6" fill="#F1F8E9" stroke="#7AA116" stroke-width="1.5"/>
  <text x="777" y="457" font-size="12.5" font-weight="bold" fill="#3F6212" text-anchor="middle">S3 Replication</text>
  <text x="777" y="474" font-size="11" fill="#3F6212" text-anchor="middle">cross-ACCOUNT, same region (not cross-region)</text>

  <!-- ============ DASHBOARD ACCOUNT ============ -->
  <rect x="40" y="496" width="1080" height="470" rx="10" fill="#F7F9FA" stroke="#146EB4" stroke-width="2.5" stroke-dasharray="9,5"/>
  <rect x="40" y="496" width="250" height="30" rx="10" fill="#146EB4"/>
  <text x="58" y="517" font-size="14" font-weight="bold" fill="#FFFFFF">Dashboard Account</text>
  <text x="1104" y="517" font-size="12" font-weight="bold" fill="#146EB4" text-anchor="end">deploy FIRST</text>

  <!-- S3 centralized -->
  <rect x="858" y="552" width="222" height="100" rx="8" fill="#FFFFFF" stroke="#7AA116" stroke-width="2"/>
  <text x="969" y="578" font-size="14" font-weight="bold" fill="#161E2D" text-anchor="middle">S3 Centralized Bucket</text>
  <text x="969" y="599" font-size="11" fill="#5A6B7B" text-anchor="middle">SSE-S3 &#183; public access blocked</text>
  <text x="969" y="618" font-size="11" fill="#5A6B7B" text-anchor="middle">all accounts, all workloads</text>
  <text x="969" y="639" font-size="10.5" fill="#7AA116" text-anchor="middle">3-year retention (configurable)</text>

  <!-- Glue crawler (directly under S3, reads from it) -->
  <rect x="858" y="700" width="222" height="86" rx="8" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="2"/>
  <text x="969" y="727" font-size="14" font-weight="bold" fill="#161E2D" text-anchor="middle">AWS Glue Crawler</text>
  <text x="969" y="748" font-size="11" fill="#5A6B7B" text-anchor="middle">scheduled every 30 min</text>
  <text x="969" y="768" font-size="11" fill="#8C4FFF" text-anchor="middle">infers schema</text>

  <!-- Glue catalog -->
  <rect x="588" y="700" width="222" height="86" rx="8" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="2"/>
  <text x="699" y="724" font-size="13.5" font-weight="bold" fill="#161E2D" text-anchor="middle">Glue Data Catalog</text>
  <text x="699" y="744" font-size="11" fill="#5A6B7B" text-anchor="middle">investigations_v2</text>
  <text x="699" y="763" font-size="10.5" fill="#5A6B7B" text-anchor="middle">partitions: account_id,</text>
  <text x="699" y="777" font-size="10.5" fill="#5A6B7B" text-anchor="middle">agentspace_id</text>

  <!-- Athena -->
  <rect x="332" y="700" width="210" height="86" rx="8" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="2"/>
  <text x="437" y="734" font-size="14" font-weight="bold" fill="#161E2D" text-anchor="middle">Amazon Athena</text>
  <text x="437" y="757" font-size="11" fill="#5A6B7B" text-anchor="middle">SQL over S3</text>

  <!-- QuickSight -->
  <rect x="332" y="848" width="210" height="90" rx="8" fill="#FFFFFF" stroke="#146EB4" stroke-width="2"/>
  <text x="437" y="876" font-size="14" font-weight="bold" fill="#161E2D" text-anchor="middle">Amazon QuickSight</text>
  <text x="437" y="897" font-size="11" fill="#5A6B7B" text-anchor="middle">DIRECT_QUERY dataset</text>
  <text x="437" y="918" font-size="11" fill="#146EB4" text-anchor="middle">5-sheet dashboard</text>

  <!-- dashboard sheet list, beside QuickSight -->
  <rect x="76" y="828" width="222" height="130" rx="8" fill="#FFFFFF" stroke="#C9D1D9" stroke-width="1.5"/>
  <text x="187" y="851" font-size="12.5" font-weight="bold" fill="#161E2D" text-anchor="middle">Dashboard sheets</text>
  <text x="90" y="872" font-size="11" fill="#5A6B7B">1 &#183; Operations Overview</text>
  <text x="90" y="890" font-size="11" fill="#5A6B7B">2 &#183; Time to RCA</text>
  <text x="90" y="908" font-size="11" fill="#5A6B7B">3 &#183; Root Cause &#38; Classification</text>
  <text x="90" y="926" font-size="11" fill="#5A6B7B">4 &#183; Agent Effectiveness</text>
  <text x="90" y="944" font-size="11" fill="#5A6B7B">5 &#183; ROI &#38; Cost</text>
  <line x1="326" y1="893" x2="304" y2="893" stroke="#687078" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- flow arrows in dashboard account: S3 -> Crawler -> Catalog -> Athena -> QuickSight -->
  <line x1="969" y1="652" x2="969" y2="694" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="990" y="678" font-size="10.5" fill="#687078">reads objects</text>
  <line x1="858" y1="743" x2="816" y2="743" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="837" y="726" font-size="10" fill="#687078" text-anchor="middle">writes</text>
  <line x1="588" y1="743" x2="548" y2="743" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="568" y="726" font-size="10" fill="#687078" text-anchor="middle">queries</text>
  <line x1="437" y1="786" x2="437" y2="842" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="580" y="988" font-size="11" fill="#8494A4" text-anchor="middle">Deployment order: Dashboard Account first (creates the centralized bucket), then each workload account (configures replication into it). Arrows show data flow, not deployment order.</text>
</svg>
